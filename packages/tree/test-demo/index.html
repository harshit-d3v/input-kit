<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@input-kit/tree Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #fff;
      padding: 60px;
      border-radius: 40px;
      box-shadow: 0 50px 100px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      margin-bottom: 50px;
      color: #1e293b;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .tree-explorer {
      background: #f8fafc;
      padding: 30px;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      min-height: 450px;
    }
    
    .node { margin-bottom: 4px; }
    .node-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      color: #475569;
      font-weight: 600;
    }
    .node-header:hover { background: #eff6ff; color: #3b82f6; }
    .node.active > .node-header { background: #e0e7ff; color: #4338ca; }
    
    .node-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      transition: transform 0.2s;
      color: #94a3b8;
    }
    .node.open > .node-header .node-icon { transform: rotate(90deg); }
    
    .node-content {
      padding-left: 30px;
      display: none;
      border-left: 2px solid #f1f5f9;
      margin-left: 24px;
    }
    .node.open > .node-content { display: block; }
    
    .folder { color: #f59e0b; }
    .file { color: #94a3b8; }
    
    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌲 Project Explorer</h1>
    
    <div class="tree-explorer">
      <div class="node open">
        <div class="node-header" onclick="toggle(this.parentElement)">
          <span class="node-icon">▶</span>
          <span class="folder">📂</span>
          <span>input-kit</span>
        </div>
        <div class="node-content">
          <div class="node">
            <div class="node-header" onclick="toggle(this.parentElement)">
              <span class="node-icon">▶</span>
              <span class="folder">📂</span>
              <span>src</span>
            </div>
            <div class="node-content">
              <div class="node-header"><span class="node-icon"></span><span class="file">📄</span> index.ts</div>
              <div class="node-header"><span class="node-icon"></span><span class="file">📄</span> types.ts</div>
            </div>
          </div>
          <div class="node">
            <div class="node-header" onclick="toggle(this.parentElement)">
              <span class="node-icon">▶</span>
              <span class="folder">📂</span>
              <span>tests</span>
            </div>
            <div class="node-content">
              <div class="node-header"><span class="node-icon"></span><span class="file">📄</span> main.test.ts</div>
            </div>
          </div>
          <div class="node-header"><span class="node-icon"></span><span class="file">📄</span> package.json</div>
          <div class="node-header"><span class="node-icon"></span><span class="file">📄</span> README.md</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span>4 folders, 5 files</span>
      <span>TypeScript 5.3</span>
    </div>
  </div>

  <script>
    function toggle(el) {
      el.classList.toggle('open');
      event.stopPropagation();
    }
    
    document.querySelectorAll('.node-header').forEach(h => {
      h.addEventListener('click', () => {
        document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
        h.parentElement.classList.add('active');
      });
    });
  </script>
</body>
</html>
