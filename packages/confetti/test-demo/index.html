<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confetti Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { color: #667eea; font-size: 2.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #6c757d; margin-bottom: 3rem; }
    .btn {
      padding: 1.5rem 3rem;
      font-size: 1.25rem;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      margin: 1rem;
    }
    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
    }
    .btn:active {
      transform: translateY(-2px);
    }
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>
  
  <div class="container">
    <h1>🎉 Confetti Burst</h1>
    <p class="subtitle">Click buttons to celebrate with confetti!</p>
    
    <button class="btn" onclick="launchConfetti()">🎊 Launch Confetti!</button>
    <br>
    <button class="btn" onclick="launchBigConfetti()">💥 BIG Celebration!</button>
    <br>
    <button class="btn" onclick="launchRainbow()">🌈 Rainbow Burst!</button>
  </div>

  <script>
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    let confettiPieces = [];

    class Confetti {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 8 + 4;
        this.speedX = Math.random() * 6 - 3;
        this.speedY = Math.random() * -15 - 5;
        this.gravity = 0.3;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = Math.random() * 10 - 5;
        this.color = color;
        this.opacity = 1;
      }

      update() {
        this.speedY += this.gravity;
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotationSpeed;
        
        if (this.y > canvas.height) {
          this.opacity -= 0.02;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    function launchConfetti() {
      const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe'];
      const x = canvas.width / 2;
      const y = canvas.height * 0.7;
      
      for (let i = 0; i < 100; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        confettiPieces.push(new Confetti(x, y, color));
      }
    }

    function launchBigConfetti() {
      const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#43e97b'];
      const x = canvas.width / 2;
      const y = canvas.height * 0.7;
      
      for (let i = 0; i < 300; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        confettiPieces.push(new Confetti(x, y, color));
      }
    }

    function launchRainbow() {
      const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
      const positions = [0.2, 0.35, 0.5, 0.65, 0.8];
      
      positions.forEach(pos => {
        const x = canvas.width * pos;
        const y = canvas.height * 0.7;
        
        for (let i = 0; i < 50; i++) {
          const color = colors[Math.floor(Math.random() * colors.length)];
          confettiPieces.push(new Confetti(x, y, color));
        }
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      confettiPieces = confettiPieces.filter(piece => piece.opacity > 0);
      
      confettiPieces.forEach(piece => {
        piece.update();
        piece.draw();
      });
      
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
