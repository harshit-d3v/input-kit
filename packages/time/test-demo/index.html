<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@input-kit/time Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      min-height: 100vh;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #fff;
      padding: 50px;
      border-radius: 32px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.25);
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #1e293b;
      font-size: 2.2rem;
      font-weight: 800;
    }
    .time-list {
      display: grid;
      gap: 15px;
    }
    .time-item {
      padding: 20px;
      background: #f8fafc;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .time-item:hover {
      transform: translateX(5px);
      border-color: #8b5cf6;
    }
    .label {
      font-weight: 600;
      color: #475569;
    }
    .relative-time {
      font-family: monospace;
      font-weight: 700;
      color: #8b5cf6;
      background: #f3f0ff;
      padding: 6px 12px;
      border-radius: 8px;
    }
    .controls {
      margin-top: 40px;
      text-align: center;
    }
    .btn {
      padding: 12px 24px;
      background: #8b5cf6;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(139, 92, 246, 0.4); }
    
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏰ Relative Time</h1>
    
    <div class="time-list" id="timeList">
      <div class="time-item">
        <span class="label">User Login</span>
        <span class="relative-time" data-time="-30">just now</span>
      </div>
      <div class="time-item">
        <span class="label">Message Received</span>
        <span class="relative-time" data-time="-120">2 minutes ago</span>
      </div>
      <div class="time-item">
        <span class="label">System Update</span>
        <span class="relative-time" data-time="-3600">1 hour ago</span>
      </div>
      <div class="time-item">
        <span class="label">Payment Sent</span>
        <span class="relative-time" data-time="-86400">1 day ago</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="addEvent()">Add New Event</button>
    </div>
  </div>

  <script>
    function getRelativeTime(seconds) {
      const abs = Math.abs(seconds);
      if (abs < 60) return seconds < 0 ? 'just now' : 'in ' + abs + 's';
      if (abs < 3600) return Math.floor(abs/60) + 'm ago';
      if (abs < 86400) return Math.floor(abs/3600) + 'h ago';
      return Math.floor(abs/86400) + 'd ago';
    }

    function updateAll() {
      document.querySelectorAll('.relative-time').forEach(el => {
        let t = parseInt(el.getAttribute('data-time'));
        t--; // simulate time passing
        el.setAttribute('data-time', t);
        el.textContent = getRelativeTime(t);
      });
    }

    function addEvent() {
      const list = document.getElementById('timeList');
      const item = document.createElement('div');
      item.className = 'time-item';
      item.style.animation = 'slideIn 0.3s ease-out';
      item.innerHTML = `
        <span class="label">New Notification</span>
        <span class="relative-time" data-time="0">just now</span>
      `;
      list.prepend(item);
    }

    setInterval(updateAll, 1000);
  </script>
</body>
</html>
