<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@input-kit/form Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 550px;
      width: 100%;
      background: #fff;
      padding: 60px 50px;
      border-radius: 40px;
      box-shadow: 0 50px 100px rgba(0,0,0,0.25);
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #1e293b;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 50px; font-weight: 500; }
    
    .field { margin-bottom: 30px; position: relative; }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: #4b5563;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .input-wrapper { position: relative; }
    input {
      width: 100%;
      padding: 18px 24px;
      border: 3px solid #f1f5f9;
      background: #f8fafc;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e293b;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    input:focus {
      background: #fff;
      border-color: #3b82f6;
      box-shadow: 0 15px 30px rgba(59, 130, 246, 0.1);
      transform: translateY(-2px);
    }
    
    .error-msg {
      color: #ef4444;
      font-size: 0.8rem;
      margin-top: 8px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transform: translateY(-5px);
      transition: all 0.3s;
      pointer-events: none;
    }
    input.invalid { border-color: #ef4444; background: #fff1f2; }
    input.invalid ~ .error-msg { opacity: 1; transform: translateY(0); }
    
    .btn-submit {
      width: 100%;
      padding: 20px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-weight: 900;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
      margin-top: 10px;
    }
    .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(59, 130, 246, 0.3); }
    .btn-submit:active { transform: scale(0.98); }
    
    .footer-hint {
      margin-top: 30px;
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Create Account</h1>
    <p class="subtitle">Join thousands of developers worldwide</p>
    
    <form id="mainForm" novalidate>
      <div class="field">
        <label>Display Name</label>
        <div class="input-wrapper">
          <input type="text" id="name" placeholder="e.g. Alex River">
          <div class="error-msg">⚠️ Name must be at least 2 characters</div>
        </div>
      </div>

      <div class="field">
        <label>Email Workspace</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="alex@company.com">
          <div class="error-msg">⚠️ Please enter a valid email address</div>
        </div>
      </div>

      <div class="field">
        <label>Secure Password</label>
        <div class="input-wrapper">
          <input type="password" id="pass" placeholder="••••••••••••">
          <div class="error-msg">⚠️ Password must be 8+ characters</div>
        </div>
      </div>

      <button type="submit" class="btn-submit">Register Now</button>
    </form>
    
    <div class="footer-hint">By clicking register you agree to our Terms of Service</div>
  </div>

  <script>
    const form = document.getElementById('mainForm');
    
    form.addEventListener('submit', e => {
      e.preventDefault();
      let hasError = false;
      
      const n = document.getElementById('name');
      const em = document.getElementById('email');
      const p = document.getElementById('pass');

      // Validate Name
      if (n.value.trim().length < 2) { n.classList.add('invalid'); hasError = true; }
      else { n.classList.remove('invalid'); }

      // Validate Email
      if (!em.value.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) { em.classList.add('invalid'); hasError = true; }
      else { em.classList.remove('invalid'); }

      // Validate Password
      if (p.value.length < 8) { p.classList.add('invalid'); hasError = true; }
      else { p.classList.remove('invalid'); }

      if (!hasError) {
        alert('🎉 Success! Your account is being created.');
        form.reset();
      }
    });

    // Real-time validation clear
    document.querySelectorAll('input').forEach(i => {
      i.addEventListener('input', () => i.classList.remove('invalid'));
    });
  </script>
</body>
</html>
