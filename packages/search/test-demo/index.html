<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Search Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
    }
    h1 { color: #667eea; font-size: 2.5rem; margin-bottom: 0.5rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 0.75rem; }
    .subtitle { text-align: center; color: #6c757d; margin-bottom: 2rem; }
    .search-wrapper {
      position: relative;
      margin-bottom: 2rem;
    }
    .search-input {
      width: 100%;
      padding: 1.25rem 1.25rem 1.25rem 3.5rem;
      font-size: 1.125rem;
      border: 3px solid #e9ecef;
      border-radius: 16px;
      outline: none;
      transition: all 0.3s;
    }
    .search-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    .search-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      color: #667eea;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 12px;
    }
    .stat {
      flex: 1;
      text-align: center;
    }
    .stat-label { font-size: 0.875rem; color: #6c757d; margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: #667eea; }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .product-card {
      padding: 1.5rem;
      border: 2px solid #e9ecef;
      border-radius: 16px;
      transition: all 0.3s;
      cursor: pointer;
      opacity: 1;
      transform: scale(1);
    }
    .product-card:hover {
      border-color: #667eea;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
    }
    .product-card.hidden {
      display: none;
    }
    .product-icon {
      width: 3rem;
      height: 3rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }
    .product-name {
      font-weight: 600;
      font-size: 1.125rem;
      margin-bottom: 0.5rem;
      color: #212529;
    }
    .product-category {
      font-size: 0.875rem;
      color: #6c757d;
      margin-bottom: 0.5rem;
    }
    .product-price {
      font-size: 1.25rem;
      font-weight: bold;
      color: #667eea;
    }
    .no-results {
      text-align: center;
      padding: 4rem 2rem;
      color: #6c757d;
      display: none;
    }
    .no-results.show {
      display: block;
    }
    .no-results-icon {
      display: inline-flex;
      color: #667eea;
      margin-bottom: 1rem;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .product-card {
      animation: fadeIn 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg> Live Search</h1>
    <p class="subtitle">Search through 24 products with instant filtering & debouncing</p>
    
    <div class="search-wrapper">
      <span class="search-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span>
      <input 
        type="text" 
        class="search-input" 
        id="searchInput"
        placeholder="Search by name or category..."
        autocomplete="off"
      >
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Showing</div>
        <div class="stat-value" id="showing">24</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total Products</div>
        <div class="stat-value">24</div>
      </div>
      <div class="stat">
        <div class="stat-label">Search Time</div>
        <div class="stat-value" id="searchTime">0ms</div>
      </div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
    <div class="no-results" id="noResults">
      <div class="no-results-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path><line x1="8" y1="11" x2="14" y2="11"></line></svg></div>
      <h3>No products found</h3>
      <p>Try searching for something else</p>
    </div>
  </div>

  <script>
    const products = [
      { name: 'MacBook Pro', category: 'Electronics', price: 2499 },
      { name: 'iPhone 15 Pro', category: 'Electronics', price: 1199 },
      { name: 'Apple Watch', category: 'Electronics', price: 399 },
      { name: 'AirPods Pro', category: 'Electronics', price: 249 },
      { name: 'Canon Camera', category: 'Electronics', price: 1499 },
      { name: 'PlayStation 5', category: 'Gaming', price: 499 },
      { name: 'Nintendo Switch', category: 'Gaming', price: 299 },
      { name: 'Cotton T-Shirt', category: 'Clothing', price: 29 },
      { name: 'Running Shoes', category: 'Clothing', price: 129 },
      { name: 'Leather Bag', category: 'Accessories', price: 199 },
      { name: 'Mechanical Keyboard', category: 'Electronics', price: 149 },
      { name: 'Wireless Mouse', category: 'Electronics', price: 79 },
      { name: 'Bookshelf', category: 'Furniture', price: 249 },
      { name: 'Sofa', category: 'Furniture', price: 899 },
      { name: 'Smart Bulb', category: 'Home', price: 39 },
      { name: 'Bluetooth Speaker', category: 'Electronics', price: 129 },
      { name: 'Coffee Maker', category: 'Kitchen', price: 89 },
      { name: 'Non-Stick Pan', category: 'Kitchen', price: 49 },
      { name: 'Backpack', category: 'Accessories', price: 79 },
      { name: 'Sunglasses', category: 'Accessories', price: 159 },
      { name: 'Yoga Mat', category: 'Sports', price: 39 },
      { name: 'Art Supplies', category: 'Hobby', price: 59 },
      { name: 'Kindle Reader', category: 'Electronics', price: 139 },
      { name: 'Guitar', category: 'Music', price: 399 }
    ];

    const searchInput = document.getElementById('searchInput');
    const productsGrid = document.getElementById('productsGrid');
    const noResults = document.getElementById('noResults');
    const showingStat = document.getElementById('showing');
    const searchTimeStat = document.getElementById('searchTime');

    let debounceTimer;

    function renderProducts(filteredProducts) {
      productsGrid.innerHTML = '';
      
      filteredProducts.forEach((product, index) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.style.animationDelay = `${index * 0.05}s`;
        card.innerHTML = `
          <div class="product-icon">${product.name.charAt(0)}</div>
          <div class="product-name">${product.name}</div>
          <div class="product-category">${product.category}</div>
          <div class="product-price">$${product.price}</div>
        `;
        productsGrid.appendChild(card);
      });

      showingStat.textContent = filteredProducts.length;
      noResults.className = filteredProducts.length === 0 ? 'no-results show' : 'no-results';
    }

    function handleSearch(query) {
      const startTime = performance.now();
      
      const searchTerm = query.toLowerCase().trim();
      
      if (!searchTerm) {
        renderProducts(products);
        searchTimeStat.textContent = '0ms';
        return;
      }

      const filtered = products.filter(product => {
        return product.name.toLowerCase().includes(searchTerm) ||
               product.category.toLowerCase().includes(searchTerm);
      });

      const endTime = performance.now();
      const searchTime = Math.round(endTime - startTime);
      searchTimeStat.textContent = `${searchTime}ms`;

      renderProducts(filtered);
    }

    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        handleSearch(e.target.value);
      }, 300);
    });

    // Initial render
    renderProducts(products);
  </script>
</body>
</html>
