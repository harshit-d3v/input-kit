<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@input-kit/markdown Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #1e293b, #334155);
      min-height: 100vh;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .main-box {
      max-width: 1100px;
      width: 100%;
      height: 700px;
      background: #fff;
      border-radius: 32px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .nav-bar {
      padding: 20px 30px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-weight: 900; color: #1e293b; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
    .tool-group { display: flex; gap: 10px; }
    .btn-tool {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      color: #64748b;
      transition: all 0.2s;
    }
    .btn-tool:hover { background: #f1f5f9; color: #3b82f6; border-color: #cbd5e1; }
    
    .editor-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .code-editor {
      padding: 30px;
      background: #fdfdfd;
      border: none;
      border-right: 1px solid #e2e8f0;
      resize: none;
      font-family: 'Fira Code', monospace;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #334155;
      outline: none;
    }
    .preview-pane {
      padding: 40px;
      overflow-y: auto;
      background: #fff;
      color: #1e293b;
      line-height: 1.6;
    }
    
    /* MD Element Styles */
    .preview-pane h1 { border-bottom: 3px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 25px; font-weight: 900; }
    .preview-pane h2 { margin-top: 30px; margin-bottom: 15px; font-weight: 800; }
    .preview-pane p { margin-bottom: 20px; }
    .preview-pane strong { color: #3b82f6; }
    .preview-pane code { background: #f1f5f9; color: #e11d48; padding: 2px 6px; border-radius: 6px; font-family: monospace; font-weight: 600; }
    .preview-pane blockquote { border-left: 5px solid #3b82f6; padding-left: 20px; margin: 20px 0; font-style: italic; color: #64748b; }
    .preview-pane ul { margin-left: 25px; margin-bottom: 20px; }
    .preview-pane li { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="main-box">
    <div class="nav-bar">
      <div class="brand">Markdown Studio</div>
      <div class="tool-group">
        <button class="btn-tool" title="Bold">B</button>
        <button class="btn-tool" title="Italic">I</button>
        <button class="btn-tool" title="Link">Link</button>
        <button class="btn-tool" title="Code">{}</button>
        <button class="btn-tool" title="Image">Img</button>
      </div>
    </div>
    <div class="editor-container">
      <textarea class="code-editor" id="input" spellcheck="false"># Getting Started

Welcome to the **Input Kit** Markdown Editor.

## Powerful Features
- **Real-time Preview**: See changes as you type.
- **Custom Styling**: Fully themeable components.
- **Type-safe**: Built with TypeScript from the ground up.

> Markdown is a lightweight markup language for creating formatted text using a plain-text editor.

Try adding some `inline code` or creating a list!</textarea>
      <div class="preview-pane" id="output"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');

    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function update() {
      let val = escapeHtml(input.value);
      
      // Basic MD Parsing Logic
      val = val.replace(/^# (.*$)/gm, '<h1>$1</h1>');
      val = val.replace(/^## (.*$)/gm, '<h2>$1</h2>');
      val = val.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
      val = val.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      val = val.replace(/`(.*?)`/g, '<code>$1</code>');
      val = val.replace(/^\- (.*$)/gm, '<li>$1</li>');
      val = val.replace(/\n/g, '<br>');
      
      output.innerHTML = val;
    }

    input.addEventListener('input', update);
    window.onload = update;
  </script>
</body>
</html>
