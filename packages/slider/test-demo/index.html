<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Range Slider Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: white;
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
    }
    h1 { color: #f5576c; font-size: 2.5rem; margin-bottom: 1rem; text-align: center; }
    .slider-wrapper {
      margin: 3rem 0;
      padding: 2rem;
      background: #f8f9fa;
      border-radius: 16px;
    }
    .slider-container {
      position: relative;
      height: 40px;
      margin: 2rem 0;
    }
    .slider-track {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      height: 4px;
      background: #dee2e6;
      border-radius: 2px;
    }
    .slider-range {
      position: absolute;
      height: 4px;
      background: linear-gradient(90deg, #f093fb, #f5576c);
      border-radius: 2px;
      top: 18px;
    }
    .slider-thumb {
      position: absolute;
      width: 24px;
      height: 24px;
      background: white;
      border: 4px solid #f5576c;
      border-radius: 50%;
      cursor: grab;
      top: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    .slider-thumb:active { cursor: grabbing; transform: scale(1.2); }
    .slider-thumb:hover { transform: scale(1.1); }
    .values {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      gap: 1rem;
    }
    .value-box {
      flex: 1;
      padding: 1.5rem;
      background: white;
      border-radius: 12px;
      text-align: center;
      border: 2px solid #f093fb;
    }
    .value-label { color: #6c757d; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .value-display { font-size: 2rem; font-weight: bold; color: #f5576c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎚️ Range Slider</h1>
    <div class="slider-wrapper">
      <h3>Price Range</h3>
      <div class="slider-container" id="slider">
        <div class="slider-track"></div>
        <div class="slider-range" id="range"></div>
        <div class="slider-thumb" id="thumbMin" style="left: 25%"></div>
        <div class="slider-thumb" id="thumbMax" style="left: 75%"></div>
      </div>
      <div class="values">
        <div class="value-box">
          <div class="value-label">Minimum</div>
          <div class="value-display">$<span id="minValue">250</span></div>
        </div>
        <div class="value-box">
          <div class="value-label">Maximum</div>
          <div class="value-display">$<span id="maxValue">750</span></div>
        </div>
        <div class="value-box">
          <div class="value-label">Range</div>
          <div class="value-display">$<span id="rangeValue">500</span></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const slider = document.getElementById('slider');
    const range = document.getElementById('range');
    const thumbMin = document.getElementById('thumbMin');
    const thumbMax = document.getElementById('thumbMax');
    const minValue = document.getElementById('minValue');
    const maxValue = document.getElementById('maxValue');
    const rangeValue = document.getElementById('rangeValue');
    
    const min = 0, max = 1000;
    let minVal = 250, maxVal = 750;
    
    function updateValues() {
      const minPercent = (minVal / max) * 100;
      const maxPercent = (maxVal / max) * 100;
      
      thumbMin.style.left = minPercent + '%';
      thumbMax.style.left = maxPercent + '%';
      range.style.left = minPercent + '%';
      range.style.width = (maxPercent - minPercent) + '%';
      
      minValue.textContent = minVal;
      maxValue.textContent = maxVal;
      rangeValue.textContent = maxVal - minVal;
    }
    
    function handleDrag(thumb, isMin) {
      let isDragging = false;
      
      thumb.addEventListener('mousedown', () => isDragging = true);
      
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const rect = slider.getBoundingClientRect();
        let percent = ((e.clientX - rect.left) / rect.width) * 100;
        percent = Math.max(0, Math.min(100, percent));
        
        const value = Math.round((percent / 100) * max);
        
        if (isMin) {
          minVal = Math.min(value, maxVal - 10);
        } else {
          maxVal = Math.max(value, minVal + 10);
        }
        
        updateValues();
      });
      
      document.addEventListener('mouseup', () => isDragging = false);
    }
    
    handleDrag(thumbMin, true);
    handleDrag(thumbMax, false);
    updateValues();
  </script>
</body>
</html>
