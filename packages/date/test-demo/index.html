<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Date Picker Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: white;
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
    }
    h1 { color: #4facfe; font-size: 2.5rem; margin-bottom: 0.5rem; text-align: center; }
    .subtitle { text-align: center; color: #6c757d; margin-bottom: 2rem; }
    .selected-date {
      text-align: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      border-radius: 16px;
      margin-bottom: 2rem;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .calendar {
      border: 2px solid #e9ecef;
      border-radius: 16px;
      overflow: hidden;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      background: #f8f9fa;
    }
    .calendar-header button {
      background: #4facfe;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.25rem;
      transition: all 0.3s;
    }
    .calendar-header button:hover {
      background: #00f2fe;
      transform: scale(1.1);
    }
    .calendar-month {
      font-size: 1.25rem;
      font-weight: bold;
      color: #212529;
    }
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #f8f9fa;
      padding: 0.75rem;
      gap: 0.5rem;
    }
    .weekday {
      text-align: center;
      font-weight: bold;
      color: #6c757d;
      font-size: 0.875rem;
    }
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 1rem;
      gap: 0.5rem;
    }
    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }
    .day:hover {
      background: #e9ecef;
      transform: scale(1.1);
    }
    .day.today {
      background: #fff3cd;
      font-weight: bold;
    }
    .day.selected {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      font-weight: bold;
    }
    .day.other-month {
      color: #adb5bd;
    }
    .day.disabled {
      color: #dee2e6;
      cursor: not-allowed;
    }
    .day.disabled:hover {
      background: none;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 Date Picker</h1>
    <p class="subtitle">Interactive calendar with month navigation</p>
    
    <div class="selected-date" id="selectedDate">Select a date</div>

    <div class="calendar">
      <div class="calendar-header">
        <button id="prevMonth">‹</button>
        <div class="calendar-month" id="currentMonth"></div>
        <button id="nextMonth">›</button>
      </div>
      
      <div class="calendar-weekdays">
        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
      </div>
      
      <div class="calendar-days" id="calendarDays"></div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDate = null;

    const months = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      document.getElementById('currentMonth').textContent = `${months[month]} ${year}`;
      
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();
      
      const calendarDays = document.getElementById('calendarDays');
      calendarDays.innerHTML = '';
      
      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
      
      for (let i = firstDay - 1; i >= 0; i--) {
        const day = daysInPrevMonth - i;
        const dayEl = createDayElement(day, 'other-month');
        calendarDays.appendChild(dayEl);
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        const dayEl = createDayElement(day, '');
        
        if (isCurrentMonth && day === today.getDate()) {
          dayEl.classList.add('today');
        }
        
        if (selectedDate && 
            selectedDate.getDate() === day && 
            selectedDate.getMonth() === month && 
            selectedDate.getFullYear() === year) {
          dayEl.classList.add('selected');
        }
        
        dayEl.addEventListener('click', () => {
          selectedDate = new Date(year, month, day);
          updateSelectedDate();
          renderCalendar();
        });
        
        calendarDays.appendChild(dayEl);
      }
      
      const remainingDays = 42 - calendarDays.children.length;
      for (let day = 1; day <= remainingDays; day++) {
        const dayEl = createDayElement(day, 'other-month');
        calendarDays.appendChild(dayEl);
      }
    }

    function createDayElement(day, className) {
      const dayEl = document.createElement('div');
      dayEl.className = `day ${className}`;
      dayEl.textContent = day;
      return dayEl;
    }

    function updateSelectedDate() {
      if (selectedDate) {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('selectedDate').textContent = selectedDate.toLocaleDateString('en-US', options);
      }
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
